---
layout: default
---
<article class="post-wrapper">
  <header class="page-header" aria-labelledby="post-title">
    <div class="page-header-ghost" aria-hidden="true">B</div>
    <div class="container">
      {% if page.categoria %}
      <p class="page-eyebrow fade-in d1">{{ page.categoria }}</p>
      {% endif %}
      <h1 id="post-title" class="page-title fade-in d2">{{ page.title }}</h1>
      <div class="post-meta fade-in d3">
        <time datetime="{{ page.date | date_to_xmlschema }}">
          {{ page.date | date: "%-d de %B, %Y" }}
        </time>
        {% if page.categoria %} · <span>{{ page.categoria }}</span>{% endif %}
      </div>
      <div class="page-divider draw-line fade-in d4" role="separator"></div>
    </div>
  </header>

  <div class="container">
    <div class="post-content">
      {{ content }}
    </div>
  </div>
</article>
