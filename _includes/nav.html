<!-- Skip link ADA/WCAG 2.1 AA -->
<a href="#main-content" class="skip-link">Ir al contenido principal</a>

<nav class="bn-nav" aria-label="Navegación principal">
  <div class="container">

    <a href="{{ '/' | relative_url }}" class="bn-nav-logo" aria-label="Bators CO — Inicio">
      <img src="https://img.mailinblue.com/10800121/images/content_library/original/69b4b088043a8dfcff79c17b.png"
           alt="Bators CO" width="30" height="30">
      <span class="bn-nav-brand" aria-hidden="true">Bators CO</span>
    </a>

    <button class="bn-nav-toggle"
            aria-label="Abrir menú de navegación"
            aria-expanded="false"
            aria-controls="nav-links">
      <span aria-hidden="true">☰</span>
    </button>

    <div class="bn-nav-links" id="nav-links" role="list">
      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}class="active" aria-current="page"{% endif %}
         role="listitem">Inicio</a>
      <a href="{{ '/eventos' | relative_url }}"
         {% if page.url contains 'eventos' %}class="active" aria-current="page"{% endif %}
         role="listitem">Eventos</a>
      <a href="{{ '/blog' | relative_url }}"
         {% if page.url contains 'blog' %}class="active" aria-current="page"{% endif %}
         role="listitem">Blog</a>
    </div>

    <button class="bn-nav-cta"
            onclick="document.getElementById('registro') && document.getElementById('registro').scrollIntoView({behavior:'smooth'})"
            aria-label="Registrarme en Bators CO">
      Registrarme
    </button>

  </div>
</nav>
